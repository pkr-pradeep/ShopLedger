<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger browser, Express server, route modules, library modules, config and JSON database, including numbered order placement steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#526174}
      .head{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#526174}
      .box{fill:#fff;stroke:#9aa9bb;stroke-width:1.4}.area{fill:#f4f7fb;stroke:#c8d2df;stroke-width:1.2}
      .ticket{fill:#fff1f2;stroke:#d9485f;stroke-width:2}.route{fill:#eef5ff;stroke:#7aa4da;stroke-width:1.3}
      .line{fill:none;stroke:#526174;stroke-width:1.6;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#flowArrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:1.5}.numtxt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="38" class="title">ShopLedger | application architecture</text>
  <text x="30" y="61" class="subtitle">Node / Express POS, Khata ledger and GST invoicing · numbered blue arrows trace POST /api/orders</text>

  <!-- Browser -->
  <rect x="30" y="100" width="220" height="150" rx="10" class="area"/>
  <text x="46" y="125" class="head">Browser UI · public/</text>
  <rect x="46" y="141" width="188" height="38" rx="6" class="box"/>
  <text x="58" y="165" class="body">index.html · css/style.css</text>
  <rect x="46" y="190" width="188" height="42" rx="6" class="box"/>
  <text x="58" y="207" class="body">js/app.js</text><text x="58" y="224" class="small">POS · order payload · preview</text>

  <!-- Server and route modules -->
  <rect x="285" y="90" width="355" height="505" rx="12" class="area"/>
  <text x="302" y="117" class="head">Express application</text>
  <rect x="302" y="132" width="321" height="55" rx="7" class="box"/>
  <text x="318" y="155" class="head">server.js</text><text x="318" y="174" class="small">static public/ · mounts routers · invoice view</text>
  <rect x="302" y="205" width="321" height="40" rx="6" class="route"/>
  <text x="317" y="230" class="body">routes/products.js · products, coupons</text>
  <rect x="302" y="255" width="321" height="55" rx="6" class="route"/>
  <text x="317" y="278" class="body" font-weight="700">routes/orders.js · create, list, get, cancel</text>
  <text x="317" y="297" class="small">POST /orders is the numbered flow</text>
  <rect x="302" y="320" width="321" height="40" rx="6" class="route"/>
  <text x="317" y="345" class="body">routes/customers.js · Khata settlements</text>
  <rect x="302" y="370" width="321" height="55" rx="6" class="route"/>
  <text x="317" y="393" class="body">routes/reports.js</text>
  <text x="317" y="412" class="small">preview pricing · dashboard · GST recon · export</text>
  <rect x="302" y="455" width="321" height="115" rx="8" class="ticket"/>
  <text x="317" y="480" class="head">Invoice endpoint · server.js</text>
  <text x="317" y="502" class="body">GET /orders/:id/invoice</text>
  <text x="317" y="523" class="body">orders.get(db, id) → invoice.render(order)</text>
  <text x="317" y="548" class="small">HTML print view · recomputes invoice figures</text>

  <!-- Libraries -->
  <rect x="680" y="90" width="300" height="505" rx="12" class="area"/>
  <text x="697" y="117" class="head">Business logic · lib/</text>
  <rect x="697" y="135" width="266" height="65" rx="6" class="ticket"/>
  <text x="712" y="159" class="head">invoice.js</text><text x="712" y="181" class="small">computeInvoiceFigures() · render()</text>
  <rect x="697" y="214" width="266" height="52" rx="6" class="box"/>
  <text x="712" y="237" class="body">pricing.js · subtotal(), computeTotals()</text><text x="712" y="255" class="small">checkout GST uses tax.js</text>
  <rect x="697" y="280" width="266" height="42" rx="6" class="box"/>
  <text x="712" y="306" class="body">tax.js · HSN slabs, CGST/SGST split</text>
  <rect x="697" y="336" width="266" height="42" rx="6" class="box"/>
  <text x="712" y="362" class="body">coupons.js · normalize, validate, discount</text>
  <rect x="697" y="392" width="266" height="42" rx="6" class="box"/>
  <text x="712" y="418" class="body">inventory.js · find, check, reserve/release</text>
  <rect x="697" y="448" width="266" height="42" rx="6" class="box"/>
  <text x="712" y="474" class="body">orders.js · add, get, cancel, list</text>
  <rect x="697" y="504" width="266" height="42" rx="6" class="box"/>
  <text x="712" y="530" class="body">ledger.js · Khata debit / settlement</text>
  <rect x="697" y="560" width="266" height="25" rx="5" class="box"/>
  <text x="708" y="578" class="small">store.js · JSON I/O · dates.js</text>

  <!-- Config and persistence -->
  <rect x="1020" y="115" width="150" height="100" rx="9" class="box"/>
  <text x="1035" y="143" class="head">config.js</text>
  <text x="1035" y="165" class="small">shop · GST slabs</text><text x="1035" y="185" class="small">coupons · settings</text>
  <rect x="1020" y="300" width="150" height="105" rx="9" class="box"/>
  <text x="1035" y="329" class="head">data/db.json</text>
  <text x="1035" y="351" class="small">products · orders</text><text x="1035" y="371" class="small">customers · ledger</text><text x="1035" y="391" class="small">audit log</text>
  <rect x="1020" y="470" width="150" height="70" rx="9" class="box"/>
  <text x="1035" y="498" class="body">lib/reports.js</text><text x="1035" y="520" class="small">dashboard · recon</text>

  <!-- Structural connections -->
  <path d="M250 178 H278 V159 H302" class="line"/>
  <path d="M462 187 V205 M462 187 V255 M462 187 V320 M462 187 V370 M462 187 V455" class="line"/>
  <path d="M623 282 H660 V161 H697" class="line"/>
  <path d="M623 282 H660 V240 H697" class="line"/>
  <path d="M623 282 H660 V301 H697" class="line"/>
  <path d="M623 282 H660 V357 H697" class="line"/>
  <path d="M623 282 H660 V413 H697" class="line"/>
  <path d="M623 282 H660 V469 H697" class="line"/>
  <path d="M623 282 H660 V525 H697" class="line"/>
  <path d="M623 482 H680 V168 H697" class="line"/>
  <path d="M963 161 H1000 V180 H1020" class="line"/>
  <path d="M963 580 H995 V353 H1020" class="line"/>
  <path d="M963 525 H1005 V353 H1020" class="line"/>
  <path d="M963 413 H1010 V505 H1020" class="line"/>
  <text x="980" y="281" class="small" transform="rotate(-90 980 281)">store.read() / write()</text>

  <!-- Numbered checkout flow -->
  <path d="M130 252 V650 H275 V282 H302" class="flow"/>
  <circle cx="130" cy="270" r="12" class="num"/><text x="130" y="270" class="numtxt">1</text>
  <path d="M623 282 H670 V240 H697" class="flow"/>
  <circle cx="648" cy="282" r="12" class="num"/><text x="648" y="282" class="numtxt">2</text>
  <path d="M830 266 V280" class="flow"/>
  <circle cx="852" cy="273" r="12" class="num"/><text x="852" y="273" class="numtxt">3</text>
  <path d="M623 282 H675 V525 H697" class="flow"/>
  <circle cx="675" cy="448" r="12" class="num"/><text x="675" y="448" class="numtxt">4</text>
  <path d="M623 282 H666 V413 H697" class="flow"/>
  <circle cx="666" cy="358" r="12" class="num"/><text x="666" y="358" class="numtxt">5</text>
  <path d="M623 282 H681 V469 H697" class="flow"/>
  <circle cx="681" cy="438" r="12" class="num"/><text x="681" y="438" class="numtxt">6</text>
  <path d="M963 572 H1002 V353 H1020" class="flow"/>
  <circle cx="1002" cy="610" r="12" class="num"/><text x="1002" y="610" class="numtxt">7</text>

  <!-- Flow key -->
  <rect x="30" y="681" width="1140" height="91" rx="10" fill="#f8fafc" stroke="#c8d2df"/>
  <text x="48" y="707" class="head">Order placement · numbered arrows</text>
  <text x="48" y="733" class="body">1 Browser submits POST /api/orders</text>
  <text x="330" y="733" class="body">2 Route checks items and stock</text>
  <text x="610" y="733" class="body">3 Pricing + tax + coupon totals</text>
  <text x="890" y="733" class="body">4 Optional Khata debit</text>
  <text x="48" y="757" class="body">5 inventory.reserve()</text>
  <text x="330" y="757" class="body">6 orders.add() + appendAudit()</text>
  <text x="610" y="757" class="body">7 store.write() saves data/db.json</text>
  <rect x="890" y="744" width="15" height="15" rx="3" fill="#fff1f2" stroke="#d9485f" stroke-width="2"/>
  <text x="914" y="757" class="small">Ticket focus: invoice.js (tax.js serves checkout GST)</text>
</svg>
